[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulca-cultural-evaluation-framework"
version = "0.1.0"
description = "Research prototype for cross-cultural art-critique evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "VULCA Project Team"}]
keywords = ["vlm-evaluation", "art-critique", "cultural-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
calibration = ["numpy>=1.24", "scikit-learn>=1.3", "scipy>=1.10"]
all = [
  "anthropic>=0.40",
  "openai>=1.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.urls]
Paper = "https://arxiv.org/abs/2601.07984"
Repository = "https://github.com/yha9806/VULCA-Framework"

[tool.setuptools.packages.find]
include = ["vulca_framework*"]

[tool.setuptools.package-data]
vulca_framework = ["dimension_keywords/*.md", "dimension_keywords/*.json"]
